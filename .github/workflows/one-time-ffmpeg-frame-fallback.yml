name: One-time FFmpeg frame fallback

on:
  push:
    paths:
      - .github/workflows/one-time-ffmpeg-frame-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded dual-path frame decoder
        run: |
          python scripts/one-time-ffmpeg-frame-fallback.py
          git diff --check
          node --test tests/final-browser-regressions.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint changed decoder path
        run: npx eslint lib/videoflow/ffmpeg.ts lib/videoflow/ai/VideoFrameDecoder.ts components/videoflow/AIWatermarkControls.tsx tests/final-browser-regressions.test.mjs

      - name: Commit guarded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/videoflow/ffmpeg.ts lib/videoflow/ai/VideoFrameDecoder.ts components/videoflow/AIWatermarkControls.tsx tests/final-browser-regressions.test.mjs
          git commit -m "Add resilient FFmpeg AI frame fallback"
          git push origin HEAD:main
