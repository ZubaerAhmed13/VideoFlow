name: One-time Firefox dynamic LaMa benchmark

on:
  push:
    branches:
      - diag/firefox-single-thread-benchmark

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install native fixture dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate deterministic fixtures
        run: npm run fixtures

      - name: Stage ONNX Runtime and fixed reference pack
        run: bash scripts/stage-ai-pack-ci.sh

      - name: Stage checksum-pinned dynamic INT8 LaMa, verify 512 parity, and patch diagnostic model
        shell: bash
        run: |
          set -euo pipefail
          DYNAMIC_URL="https://huggingface.co/g-ronimo/lama/resolve/main/lama_int8.onnx?download=true"
          DYNAMIC_SHA="1941214c210399eb815eb2d32570ba91d5e6c4ac3de4c939bd3fb09300454972"
          mkdir -p public/models
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 300 \
            --output public/models/lama-256-int8.onnx "${DYNAMIC_URL}"
          echo "${DYNAMIC_SHA}  public/models/lama-256-int8.onnx" | sha256sum --check --strict
          DYNAMIC_SIZE="$(stat -c '%s' public/models/lama-256-int8.onnx)"
          echo "DYNAMIC_MODEL_SIZE=${DYNAMIC_SIZE}"

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          const root = process.cwd();
          const runtimeDirectory = join(root, "public", "vendor", "onnx");
          const ort = await import("./public/vendor/onnx/ort.webgpu.bundle.min.mjs");
          ort.env.wasm.numThreads = 1;
          ort.env.wasm.wasmPaths = {
            mjs: pathToFileURL(join(runtimeDirectory, "ort-wasm-simd-threaded.jsep.mjs")).href,
            wasm: join(runtimeDirectory, "ort-wasm-simd-threaded.jsep.wasm"),
          };

          const size = 512;
          const pixels = size * size;
          const packed = new Float32Array(4 * pixels);
          for (let y = 0; y < size; y += 1) {
            for (let x = 0; x < size; x += 1) {
              const pixel = y * size + x;
              const hole = x >= 176 && x < 336 && y >= 190 && y < 322 ? 1 : 0;
              packed[pixel] = (0.15 + 0.7 * x / (size - 1)) * (1 - hole);
              packed[pixels + pixel] = (0.2 + 0.6 * y / (size - 1)) * (1 - hole);
              packed[pixels * 2 + pixel] = (0.3 + 0.3 * Math.sin((x + y) / 43)) * (1 - hole);
              packed[pixels * 3 + pixel] = hole;
            }
          }

          async function run(path) {
            const bytes = readFileSync(path);
            const session = await ort.InferenceSession.create(new Uint8Array(bytes), {
              executionProviders: ["wasm"],
              executionMode: "sequential",
              graphOptimizationLevel: "all",
            });
            if (session.inputNames.length !== 1) throw new Error(`Unexpected input count for ${path}: ${session.inputNames.length}`);
            const input = new Float32Array(packed);
            const started = performance.now();
            const output = await session.run({
              [session.inputNames[0]]: new ort.Tensor("float32", input, [1, 4, size, size]),
            });
            const inferenceMs = performance.now() - started;
            const tensor = output[session.outputNames[0]] ?? Object.values(output)[0];
            const values = Float32Array.from(tensor.data, Number);
            await session.release();
            return { values, inferenceMs };
          }

          const fixed = await run(join(root, "public", "models", "lama-512-int8.onnx"));
          const dynamic = await run(join(root, "public", "models", "lama-256-int8.onnx"));
          if (fixed.values.length !== dynamic.values.length) throw new Error("512 parity output length mismatch.");
          let squared = 0;
          let absolute = 0;
          let maxAbs = 0;
          let signalSquared = 0;
          for (let i = 0; i < fixed.values.length; i += 1) {
            const a = fixed.values[i];
            const b = dynamic.values[i];
            if (!Number.isFinite(a) || !Number.isFinite(b)) throw new Error("512 parity produced non-finite output.");
            const delta = a - b;
            absolute += Math.abs(delta);
            squared += delta * delta;
            signalSquared += a * a;
            maxAbs = Math.max(maxAbs, Math.abs(delta));
          }
          const mae = absolute / fixed.values.length;
          const rmse = Math.sqrt(squared / fixed.values.length);
          const relativeRmse = rmse / Math.max(1e-12, Math.sqrt(signalSquared / fixed.values.length));
          console.log(`LAMA_512_PARITY_MAE=${mae}`);
          console.log(`LAMA_512_PARITY_RMSE=${rmse}`);
          console.log(`LAMA_512_PARITY_RELATIVE_RMSE=${relativeRmse}`);
          console.log(`LAMA_512_PARITY_MAX_ABS=${maxAbs}`);
          console.log(`LAMA_FIXED_512_INFERENCE_MS=${fixed.inferenceMs}`);
          console.log(`LAMA_DYNAMIC_512_INFERENCE_MS=${dynamic.inferenceMs}`);
          NODE

          python - "${DYNAMIC_SIZE}" <<'PY'
          from pathlib import Path
          import sys

          size = int(sys.argv[1])

          registry = Path('lib/videoflow/ai/AIModelRegistry.ts')
          source = registry.read_text()
          source = source.replace('export const LAMA_512_INT8: AIModelDescriptor = {', 'export const LAMA_256_INT8: AIModelDescriptor = {')
          source = source.replace('id: "lama-512-int8"', 'id: "lama-256-int8"')
          source = source.replace('name: "LaMa 512 INT8"', 'name: "LaMa Dynamic 256 INT8"')
          source = source.replace('version: "g-ronimo-8e20140"', 'version: "g-ronimo-98e6360-dynamic-256"')
          source = source.replace('source: "https://huggingface.co/g-ronimo/lama/blob/main/lama_512_int8.onnx"', 'source: "https://huggingface.co/g-ronimo/lama/blob/main/lama_int8.onnx"')
          source = source.replace('sha256: "cab19978adc306622fe37ef60d4a52103b99c98141d499c2a2366a7ed1255dbe"', 'sha256: "1941214c210399eb815eb2d32570ba91d5e6c4ac3de4c939bd3fb09300454972"')
          source = source.replace('size: 62074990', f'size: {size}')
          source = source.replace('inputWidth: 512', 'inputWidth: 256')
          source = source.replace('inputHeight: 512', 'inputHeight: 256')
          source = source.replace('export const AI_MODELS = [LAMA_512_INT8] as const;', 'export const AI_MODELS = [LAMA_256_INT8] as const;')
          source = source.replace('export const DEFAULT_AI_MODEL = LAMA_512_INT8;', 'export const DEFAULT_AI_MODEL = LAMA_256_INT8;')
          if 'LAMA_512_INT8' in source or 'inputWidth: 512' in source or f'size: {size}' not in source:
              raise SystemExit('Dynamic model registry patch did not apply completely')
          registry.write_text(source)

          manager = Path('lib/videoflow/ai/AIManager.ts')
          source = manager.read_text()
          source = source.replace('extractROI(source, plan.roi, 512, 512)', 'extractROI(source, plan.roi, 256, 256)')
          if 'extractROI(source, plan.roi, 256, 256)' not in source:
              raise SystemExit('Dynamic ROI preprocessing patch did not apply')
          manager.write_text(source)

          client = Path('lib/videoflow/ai/AIWorkerClient.ts')
          source = client.read_text()
          source = source.replace('const WORKER_INTERACTIVE_BUDGET_MS = 165_000;', 'const WORKER_INTERACTIVE_BUDGET_MS = 300_000;')
          source = source.replace('const WORKER_INFERENCE_TIMEOUT_MS = 120_000;', 'const WORKER_INFERENCE_TIMEOUT_MS = 270_000;')
          if 'WORKER_INTERACTIVE_BUDGET_MS = 300_000' not in source or 'WORKER_INFERENCE_TIMEOUT_MS = 270_000' not in source:
              raise SystemExit('Diagnostic timeout patch did not apply')
          client.write_text(source)
          PY

      - name: Verify patched source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'id: "lama-256-int8"' lib/videoflow/ai/AIModelRegistry.ts
          grep -F 'name: "LaMa Dynamic 256 INT8"' lib/videoflow/ai/AIModelRegistry.ts
          grep -F 'inputWidth: 256' lib/videoflow/ai/AIModelRegistry.ts
          grep -F 'inputHeight: 256' lib/videoflow/ai/AIModelRegistry.ts
          grep -F 'extractROI(source, plan.roi, 256, 256)' lib/videoflow/ai/AIManager.ts
          grep -F 'WORKER_INTERACTIVE_BUDGET_MS = 300_000' lib/videoflow/ai/AIWorkerClient.ts
          grep -F 'WORKER_INFERENCE_TIMEOUT_MS = 270_000' lib/videoflow/ai/AIWorkerClient.ts
          npx tsc --noEmit

      - name: Create isolated Firefox dynamic-model benchmark spec
        shell: bash
        run: |
          cat > tests/e2e/firefox-dynamic-lama-benchmark.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";
          import { join } from "node:path";

          const root = process.cwd();
          const firefoxAI = join(root, "tests", "fixtures", "ai", "ai-static-watermark-720p.ogv");

          test("measures genuine Firefox single-thread dynamic 256 LaMa preview", async ({ page }) => {
            test.setTimeout(360_000);
            await page.goto("./");
            await expect(page.getByText("VideoFlow", { exact: true }).first()).toBeVisible();
            await page.evaluate(() => sessionStorage.setItem("videoflow.ai.wasm-thread-limit", "1"));
            await page.reload({ waitUntil: "domcontentloaded" });
            await expect(page.getByText("VideoFlow", { exact: true }).first()).toBeVisible();

            await page.getByTestId("media-import").setInputFiles(firefoxAI);
            await expect(page.locator(".vf-clip-video")).toHaveCount(1, { timeout: 45_000 });
            await page.locator(".vf-clip-video").first().click();
            await page.getByRole("button", { name: /Add region/i }).click();
            await page.getByRole("button", { name: /Install bundled AI/i }).click();
            await expect(page.getByText(/checksum verified/i)).toBeVisible({ timeout: 120_000 });
            await expect(page.getByText(/LaMa Dynamic 256 INT8/)).toBeVisible();
            await page.getByLabel("Region 1 method").selectOption("ai");

            const started = Date.now();
            await page.getByRole("button", { name: /Run AI preview/i }).click();
            await expect(page.locator(".vf-ai-preview")).toBeVisible({ timeout: 280_000 });
            const elapsed = Date.now() - started;
            console.log(`FIREFOX_DYNAMIC_256_PREVIEW_MS=${elapsed}`);
            const evidence = await page.getByText(/inference.*ROI/i).textContent();
            console.log(`FIREFOX_DYNAMIC_256_EVIDENCE=${evidence ?? "missing"}`);
          });
          EOF

      - name: Fresh production build
        run: npm run build

      - name: Stage and verify dynamic model in diagnostic dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/models
          cp public/models/lama-256-int8.onnx dist/models/lama-256-int8.onnx
          echo "1941214c210399eb815eb2d32570ba91d5e6c4ac3de4c939bd3fb09300454972  dist/models/lama-256-int8.onnx" | sha256sum --check --strict
          test "$(stat -c '%s' dist/models/lama-256-int8.onnx)" = "61512617"

      - name: Install Firefox
        run: npx playwright install --with-deps firefox

      - name: Run genuine dynamic 256 Firefox benchmark
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/firefox-dynamic-lama-benchmark.spec.ts --project=firefox --retries=0 --reporter=list | tee firefox-dynamic-256.log

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-dynamic-256-benchmark
          path: |
            firefox-dynamic-256.log
            playwright-report
            test-results
          if-no-files-found: ignore
