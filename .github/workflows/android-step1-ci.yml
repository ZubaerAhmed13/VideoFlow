name: VideoFlow Android Step 1 CI

on:
  push:
    branches:
      - android-step1-ci-20260902-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step1-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up current Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install verified Android 17 API 37.0 platform
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_URL='https://dl.google.com/android/repository/platform-37.0_r02.zip'
          PLATFORM_SHA1='ed8ebf7f8822a4de5686d427f237d2fa30ff7410'
          curl -fL --retry 4 --retry-delay 2 "$PLATFORM_URL" -o /tmp/platform-37.0_r02.zip
          echo "$PLATFORM_SHA1  /tmp/platform-37.0_r02.zip" | sha1sum -c -
          rm -rf "$ANDROID_HOME/platforms/android-37.0"
          mkdir -p "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          sdkmanager 'build-tools;36.0.0'
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip
          echo 'Installed Android platform:'
          grep -E 'Pkg.Path|AndroidVersion.ApiLevel|AndroidVersion.CodeName' "$ANDROID_HOME/platforms/android-37.0/source.properties" || true

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct isolated Android Step 1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-step1-work
          mkdir -p android-step1-work
          cat android-step1-ci/source.part*.b64 | tr -d '\n\r' | base64 -d > /tmp/VideoFlow_CI_Source_CodeOnly.zip
          echo "e6f7cf59bfb956b6990b384d85ee0bd2c09a4dcb3e9fb869ec01cfd56a6909b3  /tmp/VideoFlow_CI_Source_CodeOnly.zip" | sha256sum -c -
          unzip -q /tmp/VideoFlow_CI_Source_CodeOnly.zip -d android-step1-work
          if [ -d android-step1-ci/overrides ]; then cp -R android-step1-ci/overrides/. android-step1-work/; fi
          cd android-step1-work
          gradle wrapper --gradle-version 9.6.0
          chmod +x gradlew
          ./gradlew --version

      - name: Generate real MP4 instrumentation fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-step1-work/app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x240:rate=30 -f lavfi -i sine=frequency=1000:sample_rate=48000 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest android-step1-work/app/src/androidTest/assets/sample_av.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x240:rate=30000/1001 -t 3 -c:v libx264 -pix_fmt yuv420p -an android-step1-work/app/src/androidTest/assets/sample_video_only.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=240x320:rate=30 -t 3 -c:v libx264 -pix_fmt yuv420p -metadata:s:v:0 rotate=90 -an android-step1-work/app/src/androidTest/assets/sample_rotated.mp4
          head -c 1024 /dev/urandom > android-step1-work/app/src/androidTest/assets/malformed.mp4
          ls -lh android-step1-work/app/src/androidTest/assets

      - name: Step 1 prohibited-pattern audit
        shell: bash
        run: |
          set -euo pipefail
          cd android-step1-work
          if grep -R -n -E 'inputStream\.readBytes\(\)|ByteArray\([^)]*(fileSize|sizeBytes|file\.length)|WebView|android\.permission\.INTERNET' app/src/main app/src/main/AndroidManifest.xml; then
            echo 'Step 1 prohibited pattern detected.'
            exit 1
          fi
          if grep -R -n -E 'TODO|FIXME|Coming Soon|Not Implemented' app/src/main; then
            echo 'Unfinished Step 1 marker detected.'
            exit 1
          fi

      - name: Clean
        working-directory: android-step1-work
        run: ./gradlew clean --stacktrace

      - name: Unit tests
        working-directory: android-step1-work
        run: ./gradlew test --stacktrace

      - name: Android lint
        working-directory: android-step1-work
        run: ./gradlew lint --stacktrace

      - name: Assemble debug APK
        working-directory: android-step1-work
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble test-signed release APK
        working-directory: android-step1-work
        run: ./gradlew assembleRelease --stacktrace

      - name: Android emulator instrumentation and Compose tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 4096M
          script: cd android-step1-work && ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Package Step 1 deliverables
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p step1-deliverables/reports
          if [ -d android-step1-work ]; then
            [ ! -f android-step1-work/app/build/outputs/apk/debug/app-debug.apk ] || cp android-step1-work/app/build/outputs/apk/debug/app-debug.apk step1-deliverables/VideoFlow_Android_Step1_Debug.apk
            [ ! -f android-step1-work/app/build/outputs/apk/release/app-release.apk ] || cp android-step1-work/app/build/outputs/apk/release/app-release.apk step1-deliverables/VideoFlow_Android_Step1_Release.apk
            cp -R android-step1-work/app/build/reports step1-deliverables/reports/app-build-reports 2>/dev/null || true
            (cd android-step1-work && zip -qr ../step1-deliverables/VideoFlow_Android_Step1_CI_Source.zip . -x '.gradle/*' '*/build/*' '.idea/*' 'local.properties' '*.apk' '*.jks' '*.keystore') || true
          else
            echo 'Android source reconstruction did not complete.' > step1-deliverables/CI_FAILURE_SUMMARY.txt
          fi
          cd step1-deliverables
          : > SHA256SUMS.txt
          [ ! -f VideoFlow_Android_Step1_CI_Source.zip ] || sha256sum VideoFlow_Android_Step1_CI_Source.zip >> SHA256SUMS.txt
          for apk in *.apk; do [ -f "$apk" ] && sha256sum "$apk" >> SHA256SUMS.txt || true; done
          cat SHA256SUMS.txt

      - name: Upload Step 1 certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-Android-Step1-Certification
          path: step1-deliverables
          if-no-files-found: error
          retention-days: 30
