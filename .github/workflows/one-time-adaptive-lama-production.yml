name: One-time adaptive LaMa production migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-adaptive-lama-production.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply guarded adaptive-model migration
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-adaptive-lama.py
          sed -i 's/WORKER_INFERENCE_TIMEOUT_MS = 130_000/WORKER_INFERENCE_TIMEOUT_MS = 125_000/g' lib/videoflow/ai/AIWorkerClient.ts
          sed -i 's/WORKER_INFERENCE_TIMEOUT_MS = 130_000/WORKER_INFERENCE_TIMEOUT_MS = 125_000/g' tests/onnx-runtime-selection.test.mjs tests/final-browser-regressions.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Stage checksum-pinned dynamic model and local runtimes
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-ai-pack-ci.sh
          node scripts/copy-ffmpeg-assets.mjs

      - name: Validate adaptive AI source contracts
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx eslint \
            lib/videoflow/ai/AIModelRegistry.ts \
            lib/videoflow/ai/AIDiagnostics.ts \
            lib/videoflow/ai/AIManager.ts \
            lib/videoflow/ai/AIModelLoader.ts \
            lib/videoflow/ai/AIWorkerClient.ts \
            workers/ai-inference.worker.ts \
            components/videoflow/AIWatermarkControls.tsx

      - name: Run focused adaptive and regression tests
        run: >-
          node --test
          tests/adaptive-ai-model.test.mjs
          tests/ai-reconstruction.test.mjs
          tests/onnx-runtime-selection.test.mjs
          tests/final-browser-regressions.test.mjs
          tests/github-upload-assets.test.mjs

      - name: Certify genuine 512 WASM inference with dynamic model
        run: npm run cert:ai:wasm

      - name: Build production distribution
        run: npm run build

      - name: Verify production distribution with AI pack
        run: VIDEOFLOW_REQUIRE_AI_PACK=1 node scripts/verify-release.mjs

      - name: Verify nested-path production assets
        run: node scripts/verify-nested-http.mjs

      - name: Commit production migration only after all guards pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Adopt adaptive dynamic LaMa inference"
          git push origin HEAD:main
