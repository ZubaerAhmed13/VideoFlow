name: One-time Firefox frame capture polish

on:
  push:
    paths:
      - .github/workflows/one-time-firefox-frame-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Polish guarded frame capture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/videoflow/AIWatermarkControls.tsx")
          source = path.read_text()

          old_seek = '''      try {
        if (Math.abs(video.currentTime - target) > 0.0005 || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA)
video.currentTime = target;
      } catch (error) {'''
          new_seek = '''      try {
        if (Math.abs(video.currentTime - target) > 0.0005 || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA)
          video.currentTime = target;
      } catch (error) {'''
          if source.count(old_seek) != 1:
              raise SystemExit(f"Expected one seek-format block, found {source.count(old_seek)}")
          source = source.replace(old_seek, new_seek, 1)

          old_delay = '''        await new Promise<void>((resolve, reject) => {
const timer = window.setTimeout(resolve, FRAME_RETRY_DELAY_MS);
const onAbort = () => {
  window.clearTimeout(timer);
  signal?.removeEventListener("abort", onAbort);
  reject(new DOMException("AI job cancelled.", "AbortError"));
};
signal?.addEventListener("abort", onAbort, { once: true });
        });'''
          new_delay = '''        await new Promise<void>((resolve, reject) => {
          let timer = 0;
          const cleanup = () => {
            if (timer) window.clearTimeout(timer);
            signal?.removeEventListener("abort", onAbort);
          };
          const finish = () => { cleanup(); resolve(); };
          const onAbort = () => {
            cleanup();
            reject(new DOMException("AI job cancelled.", "AbortError"));
          };
          signal?.addEventListener("abort", onAbort, { once: true });
          timer = window.setTimeout(finish, FRAME_RETRY_DELAY_MS);
        });'''
          if source.count(old_delay) != 1:
              raise SystemExit(f"Expected one retry-delay block, found {source.count(old_delay)}")
          path.write_text(source.replace(old_delay, new_delay, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/videoflow/AIWatermarkControls.tsx
          git diff --cached --check
          git diff --cached --quiet || git commit -m "Polish Firefox AI frame capture"
          git push origin HEAD:main