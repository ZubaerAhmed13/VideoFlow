name: One-time Firefox frame capture polish

on:
  push:
    paths:
      - .github/workflows/one-time-firefox-frame-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Polish guarded frame capture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("components/videoflow/AIWatermarkControls.tsx")
          source = path.read_text()

          seek_pattern = re.compile(r'(?m)^video\.currentTime = target;$')
          source, seek_count = seek_pattern.subn('          video.currentTime = target;', source, count=1)
          if seek_count != 1:
              raise SystemExit(f"Expected one misindented seek assignment, found {seek_count}")

          delay_pattern = re.compile(
              r'(?ms)^        await new Promise<void>\(\(resolve, reject\) => \{\nconst timer = window\.setTimeout\(resolve, FRAME_RETRY_DELAY_MS\);\nconst onAbort = \(\) => \{\n  window\.clearTimeout\(timer\);\n  signal\?\.removeEventListener\("abort", onAbort\);\n  reject\(new DOMException\("AI job cancelled\.", "AbortError"\)\);\n\};\nsignal\?\.addEventListener\("abort", onAbort, \{ once: true \}\);\n        \}\);$'
          )
          replacement = "\n".join([
              '        await new Promise<void>((resolve, reject) => {',
              '          let timer = 0;',
              '          const cleanup = () => {',
              '            if (timer) window.clearTimeout(timer);',
              '            signal?.removeEventListener("abort", onAbort);',
              '          };',
              '          const finish = () => { cleanup(); resolve(); };',
              '          const onAbort = () => {',
              '            cleanup();',
              '            reject(new DOMException("AI job cancelled.", "AbortError"));',
              '          };',
              '          signal?.addEventListener("abort", onAbort, { once: true });',
              '          timer = window.setTimeout(finish, FRAME_RETRY_DELAY_MS);',
              '        });',
          ])
          source, delay_count = delay_pattern.subn(replacement, source, count=1)
          if delay_count != 1:
              raise SystemExit(f"Expected one retry-delay block, found {delay_count}")

          path.write_text(source)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/videoflow/AIWatermarkControls.tsx
          git diff --cached --check
          git diff --cached --quiet || git commit -m "Polish Firefox AI frame capture"
          git push origin HEAD:main