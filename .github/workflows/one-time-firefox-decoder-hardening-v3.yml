name: One-time Firefox decoder hardening v3

on:
  push:
    paths:
      - .github/workflows/one-time-firefox-decoder-hardening-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded decoder transform with stable async references
        shell: bash
        run: |
          awk '
            /python - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/one-time-firefox-decoder-hardening.yml > /tmp/apply_decoder_patch.py
          test -s /tmp/apply_decoder_patch.py
          python /tmp/apply_decoder_patch.py

          python - <<'PY'
          from pathlib import Path

          path = Path("components/videoflow/AIWatermarkControls.tsx")
          source = path.read_text()
          open_line = '      video = await openFrameExtractionVideo(sourceUrl, controller.signal);'
          if source.count(open_line) != 2:
              raise SystemExit(f"Expected exactly two decoder open assignments, found {source.count(open_line)}")

          stable_open = '      const extractionVideo = await openFrameExtractionVideo(sourceUrl, controller.signal);\n      video = extractionVideo;'
          source = source.replace(open_line, stable_open, 1)

          still_old = 'captureVideoFrame(video, sourceTime, controller.signal)'
          still_new = 'captureVideoFrame(extractionVideo, sourceTime, controller.signal)'
          if source.count(still_old) != 1:
              raise SystemExit(f"Expected exactly one current-frame capture, found {source.count(still_old)}")
          source = source.replace(still_old, still_new, 1)

          if source.count(open_line) != 1:
              raise SystemExit(f"Expected exactly one remaining tracking decoder open, found {source.count(open_line)}")
          source = source.replace(open_line, stable_open, 1)

          callback_old = 'captureVideoFrame(video, clip.sourceStart + Math.max(0, timelineTime - clip.timelineStart) * clip.speed, controller.signal)'
          callback_new = 'captureVideoFrame(extractionVideo, clip.sourceStart + Math.max(0, timelineTime - clip.timelineStart) * clip.speed, controller.signal)'
          if source.count(callback_old) != 1:
              raise SystemExit(f"Expected exactly one tracking frame callback, found {source.count(callback_old)}")
          source = source.replace(callback_old, callback_new, 1)
          if source.count('const extractionVideo = await openFrameExtractionVideo(sourceUrl, controller.signal);') != 2:
              raise SystemExit("Stable non-null decoder references were not created in both async operations")
          path.write_text(source)

          tests_path = Path("tests/final-browser-regressions.test.mjs")
          tests = tests_path.read_text()
          assertion_old = 'assert.match(aiControls, /captureVideoFrame\\(video, sourceTime/);'
          assertion_new = 'assert.match(aiControls, /captureVideoFrame\\(extractionVideo, sourceTime/);'
          if tests.count(assertion_old) != 1:
              raise SystemExit(f"Expected one current-frame regression assertion, found {tests.count(assertion_old)}")
          tests_path.write_text(tests.replace(assertion_old, assertion_new, 1))
          PY

          git diff --check
          node --test tests/final-browser-regressions.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint changed decoder path
        run: npx eslint components/videoflow/AIWatermarkControls.tsx lib/videoflow/ai/VideoFrameDecoder.ts tests/final-browser-regressions.test.mjs

      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/videoflow/AIWatermarkControls.tsx lib/videoflow/ai/VideoFrameDecoder.ts tests/final-browser-regressions.test.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "Harden cross-browser AI video frame decoding"
          git push origin HEAD:main
