name: One-time Firefox decoder hardening

on:
  push:
    paths:
      - .github/workflows/one-time-firefox-decoder-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply state-driven media decoder hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          decoder_path = Path("lib/videoflow/ai/VideoFrameDecoder.ts")
          decoder_path.write_text(textwrap.dedent(r'''
          const MEDIA_METADATA_TIMEOUT_MS = 8_000;
          const MEDIA_PASSIVE_DECODE_TIMEOUT_MS = 1_500;
          const MEDIA_PLAY_PRIME_TIMEOUT_MS = 2_500;
          const MEDIA_SEEK_PRIME_TIMEOUT_MS = 2_500;
          const FRAME_DECODE_TIMEOUT_MS = 8_000;
          const FRAME_CAPTURE_RETRIES = 4;
          const FRAME_RETRY_DELAY_MS = 80;
          const PRIME_SEEK_SECONDS = 1 / 30;

          type VideoWithFrameCallback = HTMLVideoElement & {
            requestVideoFrameCallback?: (callback: () => void) => number;
            cancelVideoFrameCallback?: (handle: number) => void;
          };

          function abortIfRequested(signal?: AbortSignal): void {
            if (signal?.aborted)
              throw new DOMException("AI job cancelled.", "AbortError");
          }

          function decodedFrameReady(video: HTMLVideoElement): boolean {
            return video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && video.videoWidth > 0 && video.videoHeight > 0;
          }

          function mediaError(video: HTMLVideoElement, fallback: string): Error {
            const code = video.error?.code;
            return new Error(code ? `${fallback} Media error code ${code}.` : fallback);
          }

          function waitForMediaState(
            video: HTMLVideoElement,
            predicate: () => boolean,
            timeoutMs: number,
            signal?: AbortSignal,
          ): Promise<boolean> {
            if (signal?.aborted)
              return Promise.reject(new DOMException("AI job cancelled.", "AbortError"));
            if (predicate()) return Promise.resolve(true);
            return new Promise((resolve, reject) => {
              let timer = 0;
              let settled = false;
              const events = ["loadedmetadata", "loadeddata", "canplay", "seeked", "timeupdate", "playing", "durationchange"];
              const cleanup = () => {
                if (timer) window.clearTimeout(timer);
                for (const event of events) video.removeEventListener(event, onState);
                video.removeEventListener("error", onError);
                signal?.removeEventListener("abort", onAbort);
              };
              const finish = (value: boolean) => {
                if (settled) return;
                settled = true;
                cleanup();
                resolve(value);
              };
              const onState = () => { if (predicate()) finish(true); };
              const onError = () => {
                if (settled) return;
                settled = true;
                cleanup();
                reject(mediaError(video, "Could not decode media for AI frame extraction."));
              };
              const onAbort = () => {
                if (settled) return;
                settled = true;
                cleanup();
                reject(new DOMException("AI job cancelled.", "AbortError"));
              };
              for (const event of events) video.addEventListener(event, onState);
              video.addEventListener("error", onError, { once: true });
              signal?.addEventListener("abort", onAbort, { once: true });
              timer = window.setTimeout(() => finish(predicate()), timeoutMs);
              onState();
            });
          }

          function waitForFramePresentation(video: HTMLVideoElement, signal?: AbortSignal): Promise<void> {
            if (signal?.aborted)
              return Promise.reject(new DOMException("AI job cancelled.", "AbortError"));
            const frameVideo = video as VideoWithFrameCallback;
            return new Promise((resolve, reject) => {
              let timeout = 0;
              let raf = 0;
              let frameHandle: number | undefined;
              const cleanup = () => {
                if (timeout) window.clearTimeout(timeout);
                if (raf) window.cancelAnimationFrame(raf);
                if (frameHandle !== undefined) frameVideo.cancelVideoFrameCallback?.(frameHandle);
                signal?.removeEventListener("abort", onAbort);
              };
              const finish = () => { cleanup(); resolve(); };
              const onAbort = () => { cleanup(); reject(new DOMException("AI job cancelled.", "AbortError")); };
              signal?.addEventListener("abort", onAbort, { once: true });
              timeout = window.setTimeout(finish, FRAME_RETRY_DELAY_MS * 2);
              if (typeof frameVideo.requestVideoFrameCallback === "function")
                frameHandle = frameVideo.requestVideoFrameCallback(() => finish());
              else raf = window.requestAnimationFrame(() => finish());
            });
          }

          async function primeDecodedFrame(video: HTMLVideoElement, signal?: AbortSignal): Promise<void> {
            abortIfRequested(signal);
            if (decodedFrameReady(video)) return;

            if (await waitForMediaState(video, () => decodedFrameReady(video), MEDIA_PASSIVE_DECODE_TIMEOUT_MS, signal))
              return;

            let decodedByPlayback = false;
            try {
              try { void video.play().catch(() => undefined); } catch { /* Continue to bounded seek priming. */ }
              decodedByPlayback = await waitForMediaState(video, () => decodedFrameReady(video), MEDIA_PLAY_PRIME_TIMEOUT_MS, signal);
            } finally {
              video.pause();
            }
            if (decodedByPlayback) return;

            const durationLimit = Number.isFinite(video.duration) && video.duration > 0
              ? Math.max(0, video.duration - 0.001)
              : 0;
            if (durationLimit > 0) {
              const probeTarget = Math.min(durationLimit, Math.max(PRIME_SEEK_SECONDS, video.currentTime + PRIME_SEEK_SECONDS));
              try { video.currentTime = probeTarget; } catch { /* The bounded state wait below produces the final diagnostic. */ }
              if (await waitForMediaState(video, () => decodedFrameReady(video), MEDIA_SEEK_PRIME_TIMEOUT_MS, signal))
                return;
            }

            throw new Error("Media metadata loaded, but no decoded video frame became available after passive load, muted playback priming, and seek priming.");
          }

          export async function openFrameExtractionVideo(sourceUrl: string, signal?: AbortSignal): Promise<HTMLVideoElement> {
            abortIfRequested(signal);
            const video = document.createElement("video");
            video.muted = true;
            video.defaultMuted = true;
            video.preload = "auto";
            video.playsInline = true;
            video.controls = false;
            video.tabIndex = -1;
            video.setAttribute("aria-hidden", "true");
            video.style.position = "fixed";
            video.style.left = "-2px";
            video.style.top = "-2px";
            video.style.width = "1px";
            video.style.height = "1px";
            video.style.opacity = "0";
            video.style.pointerEvents = "none";
            document.body.appendChild(video);

            try {
              const metadataReady = waitForMediaState(
                video,
                () => video.readyState >= HTMLMediaElement.HAVE_METADATA,
                MEDIA_METADATA_TIMEOUT_MS,
                signal,
              );
              video.src = sourceUrl;
              video.load();
              if (!await metadataReady)
                throw new Error("Timed out while opening media metadata for AI frame extraction.");
              await primeDecodedFrame(video, signal);
              return video;
            } catch (error) {
              releaseFrameExtractionVideo(video);
              throw error;
            }
          }

          async function waitForDecodedTarget(video: HTMLVideoElement, target: number, signal?: AbortSignal): Promise<void> {
            abortIfRequested(signal);
            await primeDecodedFrame(video, signal);
            const targetReady = () => decodedFrameReady(video) && Math.abs(video.currentTime - target) <= 0.05;
            if (!targetReady()) {
              try { video.currentTime = target; }
              catch (error) { throw error; }
              if (!await waitForMediaState(video, targetReady, FRAME_DECODE_TIMEOUT_MS, signal))
                throw new Error(`Timed out while decoding the selected AI frame at ${target.toFixed(3)} s.`);
            }
            await waitForFramePresentation(video, signal);
          }

          export async function captureVideoFrame(video: HTMLVideoElement, time: number, signal?: AbortSignal): Promise<ImageBitmap> {
            abortIfRequested(signal);
            const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : Math.max(0, time);
            const finalFrame = Math.max(0, duration - 0.001);
            const target = Math.max(0, Math.min(finalFrame, time));
            await waitForDecodedTarget(video, target, signal);

            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext("2d");
            if (!context) throw new Error("Canvas frame capture is unavailable.");

            let lastError: unknown;
            for (let attempt = 0; attempt < FRAME_CAPTURE_RETRIES; attempt += 1) {
              abortIfRequested(signal);
              try {
                context.clearRect(0, 0, canvas.width, canvas.height);
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                return await createImageBitmap(canvas);
              } catch (error) {
                lastError = error;
                if (attempt + 1 < FRAME_CAPTURE_RETRIES) {
                  await waitForFramePresentation(video, signal);
                  await new Promise<void>((resolve, reject) => {
                    let timer = 0;
                    const cleanup = () => {
                      if (timer) window.clearTimeout(timer);
                      signal?.removeEventListener("abort", onAbort);
                    };
                    const finish = () => { cleanup(); resolve(); };
                    const onAbort = () => {
                      cleanup();
                      reject(new DOMException("AI job cancelled.", "AbortError"));
                    };
                    signal?.addEventListener("abort", onAbort, { once: true });
                    timer = window.setTimeout(finish, FRAME_RETRY_DELAY_MS);
                  });
                }
              }
            }
            throw new Error(`Could not capture the decoded AI frame after ${FRAME_CAPTURE_RETRIES} attempts: ${String(lastError)}`);
          }

          export function releaseFrameExtractionVideo(video: HTMLVideoElement): void {
            try { video.pause(); } catch { /* Best-effort release. */ }
            video.removeAttribute("src");
            try { video.load(); } catch { /* Best-effort release. */ }
            video.remove();
          }
          ''').lstrip())

          ai_path = Path("components/videoflow/AIWatermarkControls.tsx")
          source = ai_path.read_text()
          import_anchor = 'import { DEFAULT_AI_SETTINGS, effectiveAISettings, reconstructFrame } from "@/lib/videoflow/ai/AIManager";\n'
          decoder_import = 'import { captureVideoFrame, openFrameExtractionVideo, releaseFrameExtractionVideo } from "@/lib/videoflow/ai/VideoFrameDecoder";\n'
          if source.count(import_anchor) != 1:
              raise SystemExit(f"Expected one AIManager import, found {source.count(import_anchor)}")
          if decoder_import not in source:
              source = source.replace(import_anchor, import_anchor + decoder_import, 1)

          helper_pattern = re.compile(r'\nconst FRAME_DECODE_TIMEOUT_MS = 8_000;.*?\nfunction maskSettings', re.S)
          helper_matches = list(helper_pattern.finditer(source))
          if len(helper_matches) != 1:
              raise SystemExit(f"Expected one legacy frame helper block, found {len(helper_matches)}")
          source = helper_pattern.sub('\nfunction maskSettings', source, count=1)

          preview_pattern = re.compile(
              r'    const video = document\.createElement\("video"\); video\.muted = true; video\.preload = "auto"; video\.src = sourceUrl;\n'
              r'    try \{\n'
              r'      await new Promise<void>\(\(resolve, reject\) => \{ video\.onloadedmetadata = \(\) => resolve\(\); video\.onerror = \(\) => reject\(new Error\("Could not open media for AI preview\."\)\); \}\);\n'
              r'      const sourceTime = clip\.sourceStart \+ Math\.max\(0, playhead - clip\.timelineStart\) \* clip\.speed;\n'
              r'      const bitmap = await frameAt\(video, sourceTime, controller\.signal\);'
          )
          if len(list(preview_pattern.finditer(source))) != 1:
              raise SystemExit("Could not uniquely locate current-frame preview media opener")
          source = preview_pattern.sub(
              '    let video: HTMLVideoElement | null = null;\n'
              '    try {\n'
              '      setProgress("Opening and priming local media decoder…");\n'
              '      video = await openFrameExtractionVideo(sourceUrl, controller.signal);\n'
              '      setProgress("Decoding current frame…");\n'
              '      const sourceTime = clip.sourceStart + Math.max(0, playhead - clip.timelineStart) * clip.speed;\n'
              '      const bitmap = await captureVideoFrame(video, sourceTime, controller.signal);',
              source,
              count=1,
          )

          tracking_pattern = re.compile(
              r'    const video = document\.createElement\("video"\); video\.muted = true; video\.preload = "auto"; video\.src = sourceUrl;\n'
              r'    try \{\n'
              r'      await new Promise<void>\(\(resolve, reject\) => \{ video\.onloadedmetadata = \(\) => resolve\(\); video\.onerror = \(\) => reject\(new Error\("Could not decode media for tracking\."\)\); \}\);\n'
              r'      const anchor = Math\.max\(mask\.start, Math\.min\(mask\.end, playhead\)\);'
          )
          if len(list(tracking_pattern.finditer(source))) != 1:
              raise SystemExit("Could not uniquely locate tracking media opener")
          source = tracking_pattern.sub(
              '    let video: HTMLVideoElement | null = null;\n'
              '    try {\n'
              '      setProgress("Opening and priming local media decoder for tracking…");\n'
              '      video = await openFrameExtractionVideo(sourceUrl, controller.signal);\n'
              '      const anchor = Math.max(mask.start, Math.min(mask.end, playhead));',
              source,
              count=1,
          )

          source = source.replace('frameAt(video, clip.sourceStart + Math.max(0, timelineTime - clip.timelineStart) * clip.speed, controller.signal)', 'captureVideoFrame(video, clip.sourceStart + Math.max(0, timelineTime - clip.timelineStart) * clip.speed, controller.signal)')
          cleanup_old = '      setBusy(false); video.removeAttribute("src"); video.load();'
          cleanup_new = '      setBusy(false); if (video) releaseFrameExtractionVideo(video);'
          if source.count(cleanup_old) != 2:
              raise SystemExit(f"Expected two legacy video cleanup sites, found {source.count(cleanup_old)}")
          source = source.replace(cleanup_old, cleanup_new)
          if 'frameAt(' in source or 'waitForDecodedVideoFrame' in source:
              raise SystemExit("Legacy frame decoder references remain")
          ai_path.write_text(source)

          test_path = Path("tests/final-browser-regressions.test.mjs")
          tests = test_path.read_text()
          old_assertions = '''  const aiControls = await read("components/videoflow/AIWatermarkControls.tsx");
          assert.match(aiControls, /aria-label="Run AI preview"/);
          assert.match(aiControls, /FRAME_DECODE_TIMEOUT_MS = 8_000/);
          assert.match(aiControls, /FRAME_CAPTURE_RETRIES = 4/);
          assert.match(aiControls, /const decodeTarget =/);
          assert.match(aiControls, /Math\\.max\\(0\\.001, target \\+ 0\\.001\\)/);
          assert.match(aiControls, /video\\.currentTime = decodeTarget/);
          assert.match(aiControls, /context\\.drawImage\\(video, 0, 0, canvas\\.width, canvas\\.height\\)/);
          assert.doesNotMatch(aiControls, /createImageBitmap\\(video\\)/);'''
          new_assertions = '''  const aiControls = await read("components/videoflow/AIWatermarkControls.tsx");
          assert.match(aiControls, /aria-label="Run AI preview"/);
          assert.equal((aiControls.match(/await openFrameExtractionVideo\\(sourceUrl/g) ?? []).length, 2);
          assert.equal((aiControls.match(/releaseFrameExtractionVideo\\(video\\)/g) ?? []).length, 2);
          assert.match(aiControls, /captureVideoFrame\\(video, sourceTime/);
          const decoder = await read("lib/videoflow/ai/VideoFrameDecoder.ts");
          assert.match(decoder, /MEDIA_METADATA_TIMEOUT_MS = 8_000/);
          assert.match(decoder, /MEDIA_PASSIVE_DECODE_TIMEOUT_MS = 1_500/);
          assert.match(decoder, /MEDIA_PLAY_PRIME_TIMEOUT_MS = 2_500/);
          assert.match(decoder, /MEDIA_SEEK_PRIME_TIMEOUT_MS = 2_500/);
          assert.match(decoder, /FRAME_DECODE_TIMEOUT_MS = 8_000/);
          assert.match(decoder, /FRAME_CAPTURE_RETRIES = 4/);
          assert.match(decoder, /document\\.body\\.appendChild\\(video\\)/);
          assert.match(decoder, /void video\\.play\\(\\)\\.catch/);
          assert.match(decoder, /video\\.pause\\(\\)/);
          assert.match(decoder, /PRIME_SEEK_SECONDS = 1 \\/ 30/);
          assert.match(decoder, /context\\.drawImage\\(video, 0, 0, canvas\\.width, canvas\\.height\\)/);
          assert.doesNotMatch(decoder, /createImageBitmap\\(video\\)/);'''
          if tests.count(old_assertions) != 1:
              raise SystemExit(f"Expected one legacy AI regression assertion block, found {tests.count(old_assertions)}")
          test_path.write_text(tests.replace(old_assertions, new_assertions, 1))
          PY

          git diff --check
          node --test tests/final-browser-regressions.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint changed decoder path
        run: npx eslint components/videoflow/AIWatermarkControls.tsx lib/videoflow/ai/VideoFrameDecoder.ts tests/final-browser-regressions.test.mjs

      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/videoflow/AIWatermarkControls.tsx lib/videoflow/ai/VideoFrameDecoder.ts tests/final-browser-regressions.test.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch produced"; exit 1; }
          git commit -m "Harden cross-browser AI video frame decoding"
          git push origin HEAD:main
