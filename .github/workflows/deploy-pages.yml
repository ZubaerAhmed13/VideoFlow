name: Deploy VideoFlow to GitHub Pages

on:
  workflow_run:
    workflows: ["VideoFlow AI release verification"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifact from the successful release gate
        uses: actions/download-artifact@v4
        with:
          name: videoflow-static-site
          path: .pages-dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist
      - name: Deploy the exact certified build
        id: deployment
        uses: actions/deploy-pages@v4
