name: One-time dual LaMa no-sacrifice migration

on:
  push:
    branches:
      - fix/dual-lama-no-sacrifice
    paths:
      - .github/workflows/one-time-dual-lama-no-sacrifice.yml

permissions:
  contents: write

jobs:
  migrate-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply dual-model architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/scripts/apply-dual-lama.py")
          text = path.read_text()
          old = '''replace(
              "components/videoflow/AISettingsPanel.tsx",
              '      setStatus("Model installed locally and checksum verified.");',
              '      setStatus("AI model pack installed locally and both checksums verified.");',
              expected=1,
          )'''
          new = '''replace(
              "components/videoflow/AISettingsPanel.tsx",
              '      const record = await installBundledAIModel();\\n      setModel(record);\\n      setStatus("Model installed locally and checksum verified.");',
              '      const record = await installBundledAIModel();\\n      setModel(record);\\n      setStatus("AI model pack installed locally — checksum verified for both models.");',
          )'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one generic bundled status transform, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          python .github/scripts/apply-dual-lama.py

      - name: Align regression contracts with dual-model architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cert_path = Path("scripts/certify-ai-wasm.mjs")
          cert = cert_path.read_text()
          replacements = {
              'throw new Error(`${spec.model} validation failed. Size mismatch.`);': 'throw new Error(`AI model validation failed: ${spec.model} size mismatch.`);',
              'throw new Error(`${spec.model} validation failed. Checksum mismatch.`);': 'throw new Error(`AI model validation failed: ${spec.model} checksum mismatch.`);',
          }
          for old, new in replacements.items():
              if cert.count(old) != 1:
                  raise SystemExit(f"certification contract missing: {old}")
              cert = cert.replace(old, new)
          cert_path.write_text(cert)

          controls_path = Path("components/videoflow/AIWatermarkControls.tsx")
          controls = controls_path.read_text()
          old_controls = 'Bundled AI pack installed locally; both model checksums verified.'
          new_controls = 'Bundled AI pack installed locally — checksum verified for both models.'
          if controls.count(old_controls) != 1:
              raise SystemExit(f"expected one AI controls bundled status, found {controls.count(old_controls)}")
          controls_path.write_text(controls.replace(old_controls, new_controls))

          regression_path = Path("tests/final-browser-regressions.test.mjs")
          regression = regression_path.read_text()
          old_init = 'assert.match(client, /initialize\\([\\s\\S]*timeoutWithinDeadline\\(deadline, WORKER_INIT_TIMEOUT_MS, "init"\\)/);'
          new_init = 'assert.match(client, /initialize\\([\\s\\S]*modelDescriptor,[\\s\\S]*timeoutWithinDeadline\\(deadline, WORKER_INIT_TIMEOUT_MS, "init", budgetMs\\)/);'
          old_infer = 'assert.match(client, /timeoutWithinDeadline\\(deadline, timeoutCeiling, "infer"\\)/);'
          new_infer = 'assert.match(client, /timeoutWithinDeadline\\(deadline, timeoutCeiling, "infer", budgetMs\\)/);'
          for old, new in [(old_init, new_init), (old_infer, new_infer)]:
              if regression.count(old) != 1:
                  raise SystemExit(f"regression contract missing: {old}")
              regression = regression.replace(old, new)
          regression_path.write_text(regression)
          PY

      - name: Apply memory-bounded batched tracking
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-batched-tracking.py
          python - <<'PY'
          from pathlib import Path

          controls_path = Path("components/videoflow/AIWatermarkControls.tsx")
          controls = controls_path.read_text()
          replacements = [
              (
                  'type StillPreview = { before: string; after: string };\nconst TRACKING_FFMPEG_BATCH_SIZE = 4;',
                  '''type StillPreview = { before: string; after: string };\nconst TRACKING_FFMPEG_MAX_BATCH_SIZE = 4;\nconst TRACKING_BATCH_PIXEL_BUDGET = 16_000_000;\n\nfunction trackingFfmpegBatchSize(width: number, height: number): number {\n  const pixels = Math.max(1, width * height);\n  return Math.max(1, Math.min(TRACKING_FFMPEG_MAX_BATCH_SIZE, Math.floor(TRACKING_BATCH_PIXEL_BUDGET / pixels)));\n}''',
              ),
              (
                  '''      const sourceTimes = times.map((timelineTime) =>\n        clip.sourceStart + Math.max(0, timelineTime - clip.timelineStart) * clip.speed,\n      );\n      const provideTrackingFrame = async (timelineTime: number, index: number): Promise<ImageBitmap> => {''',
                  '''      const sourceTimes = times.map((timelineTime) =>\n        clip.sourceStart + Math.max(0, timelineTime - clip.timelineStart) * clip.speed,\n      );\n      const trackingBatchSize = trackingFfmpegBatchSize(\n        asset.proxy?.width ?? asset.width,\n        asset.proxy?.height ?? asset.height,\n      );\n      const provideTrackingFrame = async (timelineTime: number, index: number): Promise<ImageBitmap> => {''',
              ),
              (
                  '''        const batchStart = Math.floor(index / TRACKING_FFMPEG_BATCH_SIZE) * TRACKING_FFMPEG_BATCH_SIZE;\n        if (trackingBatchStart != batchStart) {\n          releaseTrackingBatch();\n          const batchTimes = sourceTimes.slice(batchStart, batchStart + TRACKING_FFMPEG_BATCH_SIZE);\n          trackingBatch = (await captureVideoFrames(extractionSession, batchTimes, controller.signal))\n            .map((frame) => frame as ImageBitmap | null);\n          trackingBatchStart = batchStart;\n        }\n        const offset = index - trackingBatchStart;\n        const frame = trackingBatch[offset];''',
                  '''        const batchStart = Math.floor(index / trackingBatchSize) * trackingBatchSize;\n        const offset = index - batchStart;\n        // A tracking worker can fall back to the streaming implementation and\n        // request an earlier frame again. Refill a consumed slot rather than\n        // treating a safe worker restart as a media-decoder failure.\n        if (trackingBatchStart !== batchStart || !trackingBatch[offset]) {\n          releaseTrackingBatch();\n          const batchTimes = sourceTimes.slice(batchStart, batchStart + trackingBatchSize);\n          trackingBatch = (await captureVideoFrames(extractionSession, batchTimes, controller.signal))\n            .map((frame) => frame as ImageBitmap | null);\n          trackingBatchStart = batchStart;\n        }\n        const frame = trackingBatch[offset];''',
              ),
          ]
          for old, new in replacements:
              if controls.count(old) != 1:
                  raise SystemExit(f"tracking hardening source contract changed: {old[:90]!r}")
              controls = controls.replace(old, new)
          controls_path.write_text(controls)

          test_path = Path("tests/tracking-batch-extraction.test.mjs")
          test = test_path.read_text()
          test_replacements = [
              ('assert.match(controls, /TRACKING_FFMPEG_BATCH_SIZE = 4/);',
               'assert.match(controls, /TRACKING_FFMPEG_MAX_BATCH_SIZE = 4/);\n  assert.match(controls, /TRACKING_BATCH_PIXEL_BUDGET = 16_000_000/);\n  assert.match(controls, /function trackingFfmpegBatchSize/);'),
              ('assert.match(controls, /sourceTimes\\.slice\\(batchStart, batchStart \\+ TRACKING_FFMPEG_BATCH_SIZE\\)/);',
               'assert.match(controls, /sourceTimes\\.slice\\(batchStart, batchStart \\+ trackingBatchSize\\)/);\n  assert.match(controls, /trackingBatchStart !== batchStart \\|\\| !trackingBatch\\[offset\\]/);'),
          ]
          for old, new in test_replacements:
              if test.count(old) != 1:
                  raise SystemExit(f"tracking regression contract changed: {old!r}")
              test = test.replace(old, new)
          test_path.write_text(test)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install native fixture dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate deterministic fixtures
        run: npm run fixtures

      - name: Stage local FFmpeg runtime
        run: node scripts/copy-ffmpeg-assets.mjs

      - name: Stage checksum-pinned dual LaMa + local ONNX runtime
        run: bash scripts/stage-ai-pack-ci.sh

      - name: TypeScript and lint
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run lint

      - name: Fresh production build
        run: |
          rm -rf dist
          npm run build

      - name: Unit, architecture, rendered-output and regression suite
        run: npm run test:unit

      - name: Genuine dual-model WASM certification
        run: npm run cert:ai:wasm

      - name: Media quality and colour fidelity gate
        run: npm run cert:quality

      - name: Verify production distribution contains both model packs
        env:
          VIDEOFLOW_REQUIRE_AI_PACK: "1"
        run: npm run verify:dist

      - name: Verify nested-path local assets
        run: npm run verify:nested

      - name: Install Firefox for real browser proof
        run: npx playwright install --with-deps firefox

      - name: Firefox genuine neural preview, recovery, tracking and offline reuse
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/videoflow.spec.ts --project=firefox --grep "bundled AI executes a genuine local neural preview with tracking and offline reuse" --reporter=line
          status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "--- Firefox Playwright error contexts ---"
            find test-results -name error-context.md -print -exec cat {} \; 2>/dev/null || true
          fi
          exit "$status"

      - name: Commit product migration only after every gate succeeds
        run: |
          set -euo pipefail
          git checkout -- .github/scripts/apply-dual-lama.py
          git checkout -- .github/scripts/apply-batched-tracking.py
          git checkout -- ci-results 2>/dev/null || true
          git config user.name "VideoFlow Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          git add public/models/lama-512-int8.model.json tests/tracking-batch-extraction.test.mjs
          git status --short
          git commit -m "Preserve optimized 512 AI with bounded preview and tracking acceleration"
          git push origin HEAD:fix/dual-lama-no-sacrifice
