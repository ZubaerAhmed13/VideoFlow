name: One-time dual LaMa no-sacrifice migration

on:
  push:
    branches:
      - fix/dual-lama-no-sacrifice
    paths:
      - .github/workflows/one-time-dual-lama-no-sacrifice.yml

permissions:
  contents: write

jobs:
  migrate-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply dual-model architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/scripts/apply-dual-lama.py")
          text = path.read_text()
          old = '''replace(
              "components/videoflow/AISettingsPanel.tsx",
              '      setStatus("Model installed locally and checksum verified.");',
              '      setStatus("AI model pack installed locally and both checksums verified.");',
              expected=1,
          )'''
          new = '''replace(
              "components/videoflow/AISettingsPanel.tsx",
              '      const record = await installBundledAIModel();\\n      setModel(record);\\n      setStatus("Model installed locally and checksum verified.");',
              '      const record = await installBundledAIModel();\\n      setModel(record);\\n      setStatus("AI model pack installed locally — checksum verified for both models.");',
          )'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one generic bundled status transform, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          python .github/scripts/apply-dual-lama.py

      - name: Align regression contracts with dual-model architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cert_path = Path("scripts/certify-ai-wasm.mjs")
          cert = cert_path.read_text()
          replacements = {
              'throw new Error(`${spec.model} validation failed. Size mismatch.`);': 'throw new Error(`AI model validation failed: ${spec.model} size mismatch.`);',
              'throw new Error(`${spec.model} validation failed. Checksum mismatch.`);': 'throw new Error(`AI model validation failed: ${spec.model} checksum mismatch.`);',
          }
          for old, new in replacements.items():
              if cert.count(old) != 1:
                  raise SystemExit(f"certification contract missing: {old}")
              cert = cert.replace(old, new)
          cert_path.write_text(cert)

          controls_path = Path("components/videoflow/AIWatermarkControls.tsx")
          controls = controls_path.read_text()
          old_controls = 'Bundled AI pack installed locally; both model checksums verified.'
          new_controls = 'Bundled AI pack installed locally — checksum verified for both models.'
          if controls.count(old_controls) != 1:
              raise SystemExit(f"expected one AI controls bundled status, found {controls.count(old_controls)}")
          controls_path.write_text(controls.replace(old_controls, new_controls))

          regression_path = Path("tests/final-browser-regressions.test.mjs")
          regression = regression_path.read_text()
          old_init = 'assert.match(client, /initialize\\([\\s\\S]*timeoutWithinDeadline\\(deadline, WORKER_INIT_TIMEOUT_MS, "init"\\)/);'
          new_init = 'assert.match(client, /initialize\\([\\s\\S]*modelDescriptor,[\\s\\S]*timeoutWithinDeadline\\(deadline, WORKER_INIT_TIMEOUT_MS, "init", budgetMs\\)/);'
          old_infer = 'assert.match(client, /timeoutWithinDeadline\\(deadline, timeoutCeiling, "infer"\\)/);'
          new_infer = 'assert.match(client, /timeoutWithinDeadline\\(deadline, timeoutCeiling, "infer", budgetMs\\)/);'
          for old, new in [(old_init, new_init), (old_infer, new_infer)]:
              if regression.count(old) != 1:
                  raise SystemExit(f"regression contract missing: {old}")
              regression = regression.replace(old, new)
          regression_path.write_text(regression)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install native fixture dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate deterministic fixtures
        run: npm run fixtures

      - name: Stage local FFmpeg runtime
        run: node scripts/copy-ffmpeg-assets.mjs

      - name: Stage checksum-pinned dual LaMa + local ONNX runtime
        run: bash scripts/stage-ai-pack-ci.sh

      - name: TypeScript and lint
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run lint

      - name: Fresh production build
        run: |
          rm -rf dist
          npm run build

      - name: Unit, architecture, rendered-output and regression suite
        run: npm run test:unit

      - name: Genuine dual-model WASM certification
        run: npm run cert:ai:wasm

      - name: Media quality and colour fidelity gate
        run: npm run cert:quality

      - name: Verify production distribution contains both model packs
        env:
          VIDEOFLOW_REQUIRE_AI_PACK: "1"
        run: npm run verify:dist

      - name: Verify nested-path local assets
        run: npm run verify:nested

      - name: Install Firefox for real browser proof
        run: npx playwright install --with-deps firefox

      - name: Firefox genuine neural preview, recovery, tracking and offline reuse
        run: npx playwright test tests/e2e/videoflow.spec.ts --project=firefox --grep "bundled AI executes a genuine local neural preview with tracking and offline reuse" --reporter=line

      - name: Commit product migration only after every gate succeeds
        run: |
          set -euo pipefail
          git checkout -- .github/scripts/apply-dual-lama.py
          git checkout -- ci-results 2>/dev/null || true
          git config user.name "VideoFlow Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          git add public/models/lama-512-int8.model.json
          git status --short
          git commit -m "Preserve optimized 512 AI with adaptive preview accelerator"
          git push origin HEAD:fix/dual-lama-no-sacrifice
