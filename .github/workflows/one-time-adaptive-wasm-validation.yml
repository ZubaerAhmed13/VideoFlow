name: One-time adaptive WASM validation

on:
  push:
    branches:
      - fix/adaptive-wasm-threading

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore split release assets
        run: npm run restore:large-assets -- --if-present
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Adaptive ONNX regression
        run: node --test tests/onnx-runtime-selection.test.mjs
