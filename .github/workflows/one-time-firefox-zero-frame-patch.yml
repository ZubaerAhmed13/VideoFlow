name: One-time Firefox zero-frame decode polish

on:
  push:
    paths:
      - .github/workflows/one-time-firefox-zero-frame-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Polish Firefox decode patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("components/videoflow/AIWatermarkControls.tsx")
          source = path.read_text()
          old = '''      try {
        if (Math.abs(video.currentTime - decodeTarget) > 0.0005 || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA)
video.currentTime = decodeTarget;
      } catch (error) {'''
          new = '''      try {
        if (Math.abs(video.currentTime - decodeTarget) > 0.0005 || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA)
          video.currentTime = decodeTarget;
      } catch (error) {'''
          if source.count(old) != 1:
              raise SystemExit(f"Expected one zero-frame seek block, found {source.count(old)}")
          source = source.replace(old, new, 1)
          source = source.replace('  await waitForFramePresentation(video, signal);\n}\nasync function frameAt', '  await waitForFramePresentation(video, signal);\n}\n\nasync function frameAt', 1)
          path.write_text(source)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/videoflow/AIWatermarkControls.tsx
          git diff --cached --check
          git diff --cached --quiet || git commit -m "Polish Firefox zero-frame decoding"
          git push origin HEAD:main
