name: One-time adaptive LaMa patch v2

on:
  push:
    branches:
      - fix/adaptive-dynamic-lama

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded production patch
        run: python scripts/one-time-adaptive-lama-patch.py

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Focused adaptive AI regressions
        run: node --test tests/ai-reconstruction.test.mjs tests/onnx-runtime-selection.test.mjs tests/final-browser-regressions.test.mjs tests/github-upload-assets.test.mjs

      - name: Lint changed runtime files
        run: npx eslint lib/videoflow/ai/AIModelRegistry.ts lib/videoflow/ai/AIModelLoader.ts lib/videoflow/ai/AIDiagnostics.ts lib/videoflow/ai/AIManager.ts lib/videoflow/ai/AIWorkerClient.ts components/videoflow/AIWatermarkControls.tsx components/videoflow/DiagnosticsPanel.tsx

      - name: Commit production patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/one-time-adaptive-lama-patch-v2.yml scripts/one-time-adaptive-lama-patch.py
          git diff --cached --check
          git commit -m "Use adaptive dynamic LaMa inference"
          git push origin HEAD:fix/adaptive-dynamic-lama
